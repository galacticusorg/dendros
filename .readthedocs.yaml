version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    # setuptools-scm needs the full history and tags to derive the version;
    # Read the Docs performs a shallow clone by default.
    post_checkout:
      - git fetch --tags --unshallow || git fetch --tags

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
        # scipy (in the mcmc extra) is needed to import the MCMC modules that
        # autodoc documents.
        - mcmc
    - requirements: docs/requirements.txt

sphinx:
  configuration: docs/conf.py
  # Fail rather than publish empty API pages when autodoc cannot import dendros.
  fail_on_warning: true
